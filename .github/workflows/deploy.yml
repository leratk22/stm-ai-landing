name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Разрешения, которых требует деплой Pages из Actions
permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: важен последний
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        # Флаг включает base: /stm-ai-landing — без него отвалятся пути
        env:
          GITHUB_PAGES: 'true'
        run: pnpm build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
